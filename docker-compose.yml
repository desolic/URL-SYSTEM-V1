# DESOLIC URL shortener — deploy on Synology Container Manager as a "Project".
#
# The Cloudflare Tunnel is NOT part of this project — bring up the shared
# tunnel in ./cloudflared FIRST (docker compose up -d there). It creates the
# `cloudflare-tunnel` network below, which this project joins as an external
# network.
#
# Effect:
#   - url-shortener is NOT published on any host port.
#   - url-shortener joins only the `cloudflare-tunnel` network, which is
#     `internal: true`; the container has no direct path to the internet.
#   - The shared cloudflared container reaches url-shortener via Docker DNS
#     under the fixed name `url-shortener` (container_name below).
#
# Secret in the .env file next to this one (never commit it):
#   AUTH_TOKEN_HASH = run "npm run gen-token"
#
# AUTH_TOKEN_HASH is mounted into url-shortener as a file under
# /run/secrets/auth_token_hash, so it does not appear in `docker inspect`.

secrets:
  auth_token_hash:
    environment: AUTH_TOKEN_HASH

services:
  url-shortener:
    build: .
    image: desolic-url-system
    container_name: url-shortener
    restart: unless-stopped
    environment:
      AUTH_TOKEN_HASH_FILE: /run/secrets/auth_token_hash
      SHORT_DOMAIN: ${SHORT_DOMAIN:-link.desolic.com}
      DEFAULT_REDIRECT: ${DEFAULT_REDIRECT:-https://desolic.com/}
      TRUST_PROXY: "true"
    secrets:
      - auth_token_hash
    volumes:
      # The host folder must be writable by UID 1000 (the container's "node"
      # user): chown -R 1000:1000 ./data
      - ./data:/data
    networks:
      - cloudflare-tunnel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 100
    cpus: 0.5

networks:
  # Created by ./cloudflared/docker-compose.yml (must be up first).
  # `internal: true` there — this project cannot reach the internet.
  cloudflare-tunnel:
    external: true
    name: cloudflare-tunnel
